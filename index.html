<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ede6"><title>İzometrik Bursa · Dokuz çizim denemesi</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ede6;color:#274b3c;font:15px system-ui,sans-serif}header{position:absolute;z-index:2;top:16px;left:16px;max-width:min(360px,calc(100vw - 32px));background:#fffef5ee;padding:13px 16px;border:1px solid #d0dacb;border-radius:12px;box-shadow:0 4px 20px #23423118}h1{font-size:19px;margin:0 0 4px}p{margin:4px 0;line-height:1.35;font-size:12px;color:#536b5d}#view{height:100dvh;overflow:hidden;touch-action:none;cursor:grab}#world{position:absolute;left:0;top:0;width:3072px;height:3072px;transform-origin:0 0;display:grid;grid-template-columns:repeat(3,1024px);grid-template-rows:repeat(3,1024px)}.tile{position:relative;width:1024px;height:1024px}.tile img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}.frames .tile{outline:3px solid #ef5b43;outline-offset:-3px}.frames .tile:after{content:attr(data-label);position:absolute;top:10px;left:10px;padding:8px 14px;color:white;background:#a63223;border-radius:6px;font-size:22px}.controls{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}button{min-width:46px;min-height:46px;background:#fffef7;color:#244538;border:1px solid #cbd9c9;border-radius:8px;cursor:pointer;font:20px system-ui}#frame{font-size:13px;padding:0 10px}button:focus-visible{outline:3px solid #25836c}.note{position:absolute;bottom:16px;left:16px;background:#fffef5ee;border:1px solid #d0dacb;border-radius:8px;padding:9px 12px;max-width:calc(100vw - 120px);font-size:12px}@media(max-width:500px){header{top:10px;left:10px}h1{font-size:17px}.controls{right:10px;bottom:10px}.note{left:10px;bottom:10px}}
</style></head><body><header><h1>İzometrik Bursa</h1><p>Ulu Cami çevresi · 9 çizim denemesi</p><p>Çizimler bağımsız üretildi; sınır kaymaları ve boş alanlar görülebilir.</p></header><main id="view" aria-label="Dokuz çizimden oluşan deneysel harita"><div id="world" class="frames"></div></main><div class="note">Deneysel önizleme · Ölçüm veya konum doğruluğu garantisi yoktur.</div><div class="controls"><button id="plus" aria-label="Yakınlaştır">+</button><button id="minus" aria-label="Uzaklaştır">−</button><button id="reset" aria-label="Haritayı ortala">⌂</button><button id="frame" aria-pressed="true">Çerçeveler</button></div><script>
const view=document.querySelector('#view'),world=document.querySelector('#world'),frame=document.querySelector('#frame');for(let r=0;r<3;r++)for(let c=0;c<3;c++){const tile=document.createElement('div');tile.className='tile';tile.dataset.label=`${r+1} · ${c+1}`;const img=document.createElement('img');img.src=`gorseller/cizim-${r}-${c}.jpg`;img.alt=`Çizim ${r+1}, ${c+1}`;img.draggable=false;tile.append(img);world.append(tile)}let scale=1,x=0,y=0,last=null;const points=new Map();function draw(){world.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function reset(){scale=Math.min(innerWidth,innerHeight)/3072*.9;x=(innerWidth-3072*scale)/2;y=(innerHeight-3072*scale)/2;draw()}function zoom(f,cx,cy){let n=Math.max(.05,Math.min(3,scale*f));x=cx-(cx-x)*n/scale;y=cy-(cy-y)*n/scale;scale=n;draw()}function gesture(){let p=[...points.values()];return p.length===1?{x:p[0].x,y:p[0].y,d:0}:p.length>=2?{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}:null}view.addEventListener('pointerdown',e=>{points.set(e.pointerId,{x:e.clientX,y:e.clientY});view.setPointerCapture(e.pointerId);last=gesture();view.style.cursor='grabbing'});view.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture();if(last&&g){x+=g.x-last.x;y+=g.y-last.y;if(g.d&&last.d)zoom(g.d/last.d,g.x,g.y);else draw()}last=g});function end(e){points.delete(e.pointerId);last=gesture();view.style.cursor='grab'}view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);view.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});document.querySelector('#plus').onclick=()=>zoom(1.3,innerWidth/2,innerHeight/2);document.querySelector('#minus').onclick=()=>zoom(1/1.3,innerWidth/2,innerHeight/2);document.querySelector('#reset').onclick=reset;frame.onclick=()=>{let on=world.classList.toggle('frames');frame.setAttribute('aria-pressed',String(on))};reset();
</script></body></html>
